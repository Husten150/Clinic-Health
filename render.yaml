databases:
  - name: clinic-health-db
    databaseName: clinic_health
    user: clinic_health
    plan: free

services:
  - type: web
    name: clinic-health
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-health-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: clinic-health-e8414
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Clinic Health</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="site-header"><a class="brand" href="/">Clinic<span>Health</span></a><nav class="nav"><a href="/">Home</a><a href="/signin">Sign in</a></nav></header><main class="auth-layout"><section class="auth-intro"><p class="eyebrow">GET STARTED</p><h1>Your care journey starts here.</h1><p>Create your secure patient account to book and manage clinic appointments.</p></section><section class="form-card"><h2>Create your account</h2><p class="muted">All fields are required.</p><form id="signup-form"><label for="full-name">Full name</label><input id="full-name" name="full_name" autocomplete="name" required minlength="2" maxlength="120"><label for="dob">Date of birth</label><input id="dob" name="date_of_birth" type="date" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><p class="hint">Use at least 10 characters.</p><button class="button full" type="submit">Create account with email</button><div class="or-divider">or continue with</div><div id="google-signup" class="google-button"></div><div class="form-message" id="form-message" aria-live="polite"></div></form><p class="form-foot">Already registered? <a href="/signin">Sign in</a></p></section></main><script src="/static/app.js" defer></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments | Clinic Health</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="site-header"><a class="brand" href="/">Clinic<span>Health</span></a><button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button><nav class="nav" id="main-nav"><a href="/appointments" aria-current="page">Book appointment</a><a href="/bookings">My bookings</a><button class="link-button" id="signout">Sign out</button></nav></header><main class="dashboard wrap"><div class="page-heading"><p class="eyebrow">PATIENT PORTAL</p><h1>Book an appointment</h1><p class="muted" id="patient-greeting">Loading your account…</p></div><section class="content-card"><div class="section-heading"><div><h2>Available times</h2><p class="muted">Choose a date to see open appointment slots.</p></div><div class="date-field"><label for="appointment-date">Appointment date</label><input id="appointment-date" type="date"></div></div><div id="slots" class="slot-grid"><p class="muted">Loading availability…</p></div></section><section class="content-card" id="booking-panel"><h2>Appointment reason</h2><p class="muted" id="selected-slot">Select an available time above to continue.</p><form id="booking-form"><label for="reason">What is the reason for your visit?</label><textarea id="reason" minlength="5" maxlength="1000" required placeholder="Briefly describe why you would like an appointment."></textarea><button class="button" id="book-button" disabled>Confirm appointment</button><div class="form-message" id="booking-message" aria-live="polite"></div></form></section></main><footer class="site-footer">Clinic Health · Patient portal</footer><script src="/static/app.js" defer></script></body></html>
